name: 24/7 Telegram Bots Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Har 6 soatda to'xtab qolmasligi uchun yangilab turadi
    - cron: '0 */6 * * *'

jobs:
  run-bots:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI

      - name: Ikkala botni ishga tushirish
        run: |
          python run_both_bots.py
