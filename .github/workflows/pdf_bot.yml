name: 24/7 PDF & OCR Tarjimon Bot Server

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-pdf-translator-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.11 ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tesseract OCR va Tizim modullarini o'rnatish
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng tesseract-ocr-uzb poppler-utils

      - name: Python Kutubxonalarini o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI pypdf pypdfium2 pytesseract Pillow python-docx reportlab deep-translator requests

      - name: PDF & OCR Tarjimon Botini 24/7 ishga tushirish
        env:
          BOT_TOKEN: 8925389899:AAFL5NzM5bIu0eK8yVNCi_Fpj-QNPKL7J5c
          ADMIN_ID: 1021089367
        run: |
          python pdf_tarjimon_bot.py
