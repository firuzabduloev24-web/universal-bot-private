          python-version: '3.11'

      - name: Kerakli kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI reportlab requests urllib3

      - name: Universal Ish Topish Botini 24/7 ishga tushirish
        env:
          BOT_TOKEN: "8863390415:AAEj3E_H-Kv36OF9gb0pGJOXMvQd5KldSgQ"
          ADMIN_ID: "1021089367"
          PYTHONUNBUFFERED: "1"
        run: |
          python ish_topish_bot.py
